name: Validate Cell_ppt

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install fixed dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Compile Python runtime
        run: python -m compileall -q install.py doctor.py plugins/cell-ppt/skills/cell-ppt/scripts tests/test_cross_platform.py
      - name: Validate macOS setup entrypoint
        if: runner.os == 'macOS'
        run: bash -n ./setup.sh
      - name: Test shared core and editable OOXML output
        run: python tests/test_cross_platform.py

  windows-live-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install fixed dependencies
        shell: powershell
        run: py -3 -m pip install --requirement .\requirements.lock
      - name: Validate package and Windows credential flow
        shell: powershell
        run: .\tests\test-package.ps1
      - name: Run deterministic Windows workflow test
        shell: powershell
        run: .\tests\test-windows-e2e.ps1
