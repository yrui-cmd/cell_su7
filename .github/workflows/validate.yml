name: Validate Cell_ppt package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        shell: powershell
        run: py -3 -m pip install --requirement .\requirements.lock
      - name: Validate package and credential flow
        shell: powershell
        run: .\tests\test-package.ps1
      - name: Run deterministic Windows workflow test
        shell: powershell
        run: .\tests\test-windows-e2e.ps1
      - name: Build and verify release archive
        shell: powershell
        run: |
          .\build-release.ps1 -SkipTests
          $zip = '.\dist\cell-ppt-v0.1.0.zip'
          $expected = ((Get-Content "$zip.sha256") -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release SHA256 mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: cell-ppt-v0.1.0
          path: |
            dist/cell-ppt-v0.1.0.zip
            dist/cell-ppt-v0.1.0.zip.sha256
